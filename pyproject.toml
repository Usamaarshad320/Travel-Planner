[project]
name = "travel-planner"
version = "0.1.0"
description = "An agentic AI travel planning and decision-support system."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
